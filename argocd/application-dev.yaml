apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: convertix-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dhia-sel/convertix-manifests.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: convertix-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
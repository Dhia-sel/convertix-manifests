apiVersion: apps/v1
kind: Deployment
metadata:
  name: convertix
  labels:
    app.kubernetes.io/name: convertix
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: convertix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convertix
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: convertix
          image: ghcr.io/dhia-sel/convertix:0.1.0
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10